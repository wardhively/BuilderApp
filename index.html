<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New View • Builder Portal Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{--nv-red:#b91c1c;--nv-dark:#000}
    html,body{height:100%;margin:0;background:var(--nv-dark);color:#fff;font-family:Inter,Arial,sans-serif}
    #map{flex:1 1 0%;min-height:300px}
    .sidebar-scroll::-webkit-scrollbar{width:6px}
    .sidebar-scroll::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
  </style>
</head>
<body class="flex flex-col h-full overflow-hidden">
  <header class="flex-none flex items-center justify-between bg-black px-4 py-3 shadow-lg z-30">
    <h1 class="text-lg font-semibold select-none"><span class="text-[var(--nv-red)]">New View</span> Builder Portal</h1>
    <div class="flex items-center gap-3">
      <button id="btnSidebar" class="md:hidden text-xl">☰</button>
      <button id="topNewProject" class="px-3 py-1 bg-[var(--nv-red)] rounded hover:bg-red-500 text-sm">+ Project</button>
    </div>
  </header>
  <div class="flex flex-1 overflow-hidden">
    <aside id="sidebar" class="w-64 bg-zinc-900 p-4 sidebar-scroll overflow-y-auto hidden md:block flex-shrink-0">
      <button id="btnNewProject" class="w-full mb-4 py-2 bg-[var(--nv-red)] rounded hover:bg-red-500">+ New Project</button>
      <ul id="projectList" class="space-y-2 text-sm"></ul>
    </aside>
    <div id="map" class="relative"></div>
    <aside id="infoPanel" class="fixed md:static right-0 top-[60px] md:top-0 w-80 bg-zinc-800 p-4 shadow-lg h-[calc(100%-60px)] md:h-full overflow-y-auto transform translate-x-full md:translate-x-0 transition-transform z-20 md:border-l border-zinc-700">
      <h2 id="houseTitle" class="text-lg font-semibold mb-2"></h2>
      <p class="text-xs italic mb-2">Plan: <span id="planFile">—</span></p>
      <p class="text-sm mb-2">Cost: <span id="houseCost">$0</span></p>
      <button id="closeInfo" class="md:hidden mt-4 w-full py-1 bg-[var(--nv-red)] rounded">Close</button>
    </aside>
    <button id="btnAddHouse" class="hidden fixed bottom-6 right-6 p-4 bg-[var(--nv-red)] rounded-full hover:bg-red-500 shadow-lg" title="Add House">＋</button>
  </div>
  <div id="projectModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-40">
    <div class="bg-zinc-800 p-6 w-80 rounded shadow-lg">
      <h3 class="text-lg mb-4">New Project</h3>
      <input id="projName" type="text" placeholder="Project name" class="w-full text-black rounded p-2 mb-4" />
      <div class="flex justify-end gap-2">
        <button id="cancelProj" class="px-3 py-1 bg-zinc-600 rounded">Cancel</button>
        <button id="saveProj" class="px-3 py-1 bg-[var(--nv-red)] rounded hover:bg-red-500">Save</button>
      </div>
    </div>
  </div>
  <div id="houseModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-40">
    <div class="bg-zinc-800 p-6 w-80 rounded shadow-lg">
      <h3 class="text-lg mb-4">New House</h3>
      <input id="houseNameInput" type="text" placeholder="House label" class="w-full text-black rounded p-2 mb-3" />
      <label class="block text-sm mb-1">Plan PDF</label>
      <input id="planFileInput" type="file" accept="application/pdf" class="w-full mb-4 text-sm" />
      <div class="flex justify-end gap-2">
        <button id="cancelHouse" class="px-3 py-1 bg-zinc-600 rounded">Cancel</button>
        <button id="saveHouse" class="px-3 py-1 bg-[var(--nv-red)] rounded hover:bg-red-500">Save</button>
      </div>
    </div>
  </div>
<script>
const db = { builders: [{ id: 'b1', name: 'Default', projects: [] }] };
let selectedProjectId = null;
let map, addHouseMode = false, tempLatLng = null;
function ensureBuilder(){ if(!db.builders.length) db.builders.push({ id:'b1', name:'Default', projects:[] }); if(!db.builders[0].projects) db.builders[0].projects=[]; }
function toggle(id, show=true){ const el=document.getElementById(id); if(!el) return; el.classList[show?'remove':'add']('hidden'); if(show) el.classList.add('flex'); else el.classList.remove('flex'); }
function on(id,evt,fn){ const el=document.getElementById(id); if(el) el.addEventListener(evt,fn); }
function initMap(){ map=L.map('map',{ zoomControl:false }).setView([30.307,-86.11],10); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ attribution:'©OpenStreetMap' }).addTo(map); map.on('click',mapClick); }
function mapClick(e){ if(!addHouseMode) return; tempLatLng=e.latlng; toggle('houseModal',true); }
function renderProjects(){ ensureBuilder(); const ul=document.getElementById('projectList'); ul.innerHTML=''; db.builders[0].projects.forEach(p=>{ const li=document.createElement('li'); li.textContent=p.name; li.className='cursor-pointer px-2 py-1 rounded hover:bg-zinc-700'+(p.id===selectedProjectId?' bg-red-700':''); li.onclick=()=>selectProject(p.id); ul.appendChild(li); }); }
function selectProject(id){ selectedProjectId=id; renderProjects(); document.getElementById('btnAddHouse').classList.remove('hidden'); const sidebar=document.getElementById('sidebar'); sidebar.classList.remove('hidden'); sidebar.classList.add('block'); }
function createProject(){ ensureBuilder(); const name=document.getElementById('projName').value.trim(); if(!name) return alert('Project name required'); const id='proj-'+Date.now(); db.builders[0].projects.push({ id,name,houses:[] }); document.getElementById('projName').value=''; toggle('projectModal',false); selectProject(id); }
function startAddHouse(){ if(!selectedProjectId) return alert('Select a project first'); addHouseMode=true; map.getContainer().style.cursor='crosshair'; alert('Click the map where the house sits'); }
function saveHouse(){ const name=document.getElementById('houseNameInput').value.trim(); if(!name||!tempLatLng) return alert('All fields required'); const plan=document.getElementById('planFileInput').files[0]?.name||'n/a'; const proj=db.builders[0].projects.find(p=>p.id===selectedProjectId); const h={ id:'house-'+Date.now(), name, lat:tempLatLng.lat, lng:tempLatLng.lng, plan, cost:25000 }; proj.houses.push(h); L.marker(tempLatLng,{ title:name, icon:L.icon({ iconUrl:'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/images/marker-icon.png', iconAnchor:[12,41] }) }).addTo(map).on('click',()=>showHouse(h)); toggle('houseModal',false); addHouseMode=false; map.getContainer().style.cursor=''; tempLatLng=null; renderProjects(); }
function showHouse(h){ document.getElementById('houseTitle').textContent=h.name; document.getElementById('planFile').textContent=h.plan; document.getElementById('houseCost').textContent='$'+h.cost.toLocaleString(); document.getElementById('infoPanel').classList.remove('translate-x-full'); }
window.addEventListener('DOMContentLoaded',()=>{ initMap(); renderProjects(); on('btnSidebar','click',()=>{ const sidebar=document.getElementById('sidebar'); sidebar.classList.toggle('hidden'); sidebar.classList.toggle('block'); }); on('btnNewProject','click',()=>toggle('projectModal',true)); on('topNewProject','click',()=>toggle('projectModal',true)); on('cancelProj','click',()=>toggle('projectModal',false)); on('saveProj','click',createProject); on('btnAddHouse','click',startAddHouse); on('cancelHouse','click',()=>{ toggle('houseModal',false); addHouseMode=false; map.getContainer().style.cursor=''; tempLatLng=null; }); on('saveHouse','click',saveHouse); on('closeInfo','click',()=>{ document.getElementById('infoPanel').classList.add('translate-x-full'); }); });
</script>
</body>
</html>
